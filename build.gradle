plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.8.0"
}

group 'com.itsheep.commentdetails'

repositories {
    mavenCentral()
}
haloPlugin {
    watchDomains {
        // consoleSource 为自定义的名称，可以随意取
        consoleSource {
            // 监听 console/src/ 目录下的文件变化
            files files('src/main/**')
            files files('src/ui/**')
            // exclude '**/node_modules/**'
            // exclude '**/.idea/**'
            // exclude '**/.git/**'
            // exclude '**/.gradle/**'
            // exclude 'src/main/resources/ui/**'
            // exclude 'src/main/resources/console/**'
            // exclude 'build/**'
            // exclude 'gradle/**'
            // exclude 'dist/**'
            // exclude 'test/java/**'
            // exclude 'test/resources/**'
        }
        // ... 可以添加多个
    }
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.26.0')
    compileOnly 'run.halo.app:api'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

halo {
    version = '2.26'
}

tasks.register('processUiResources', Copy) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/ui')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}


